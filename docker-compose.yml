version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wedding_postgres
    environment:
      POSTGRES_USER: wedding_user
      POSTGRES_PASSWORD: wedding_password_secure
      POSTGRES_DB: wedding_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding_user -d wedding_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wedding_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wedding_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://wedding_user:wedding_password_secure@postgres:5432/wedding_platform
      SYNC_DATABASE_URL: postgresql://wedding_user:wedding_password_secure@postgres:5432/wedding_platform
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super_secret_jwt_key_wedding_platform_2026
      RAZORPAY_KEY_ID: rzp_test_wedding_key_123
      RAZORPAY_KEY_SECRET: rzp_test_secret_abc_456
      RAZORPAY_WEBHOOK_SECRET: webhook_secret_xyz_789
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wedding_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
